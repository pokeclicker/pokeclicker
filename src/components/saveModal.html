<div class="modal fade noselect" id="saveModal" tabindex="-1" role="dialog"
     aria-labelledby="saveModalLabel">
    <div class="modal-dialog modal-dialog-scrollable modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header" style='justify-content: space-around;'>
                <h5 class="modal-title" data-bind="t: 'save.title'">Save Data</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <div id="saveTab">
                    <form class="form-inline input-group">
                        <input class="outline-dark form-control" placeholder="Enter code..." id="redeemable-code-input" type="text" data-bind="tAttr: { placeholder: 'save.enterCodePlaceholder' }" />
                        <div class="input-group-append">
                            <button class="btn btn-info" name="name" value="value" type="submit" onclick="RedeemableCodeController.enterCode(); return false;" data-bind="t: 'save.claim'">Claim!</button>
                        </div>
                    </form>
                    <hr>
                    <!-- ko if: App.game.discord.enabled -->
                    <button class="btn btn-primary btn-block" onClick="App.game.discord.login()" data-bind="visible: !App.game.discord.ID(), t: 'save.linkDiscord'">Link Discord</button>
                    <button class="btn btn-warning btn-block" onClick="App.game.discord.logout(true)" data-bind="visible: App.game.discord.ID(), t: 'save.unlinkDiscord'">Unlink Discord</button>
                    <i class="text-warning" data-bind="tHtml: 'save.discordNote'"><strong>Note:</strong> This is <strong>not</strong> used for cloud saves;<br/>it just allows you to enter codes received from the Discord bot.</i>
                    <hr>
                    <!-- /ko -->

                    <button class="btn btn-primary btn-block" onClick="Save.download()" data-bind="t: 'save.downloadSave'">Download Save</button>
                    <i data-bind="t: 'save.downloadHelp'">If this does not work, you can copy the contents of the save and paste it into a '.txt' file</i>
                    <button class="btn btn-primary btn-block" onclick="Save.copySaveToClipboard()" data-bind="t: 'save.copyToClipboard'">Copy to Clipboard</button>
                    <hr>

                    <input type="file" id="import-save" accept=".txt" style="display:none;"
                            onchange=Save.loadFromFile(this.files[0])>
                    <label for="import-save" class="btn btn-primary btn-block" data-bind="t: 'save.importSave'">Import Save</label>
                    <hr>
                    <h5 class="text-danger" data-bind="t: 'save.deleteWarning'">You will not be able to recover your savefile!</h5>
                    <button class="btn btn-danger btn-block" onClick="Save.delete()" data-bind="t: 'save.deleteSave'">DELETE SAVE</button>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" data-bind="t: 'common.close'">Close</button>
            </div>
        </div>
    </div>
</div>
