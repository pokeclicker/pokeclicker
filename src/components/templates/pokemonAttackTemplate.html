<script type="text/html" id="pokemonAttackTemplate">
    <span style="display: inline;">
        Pokémon Attack:
        <span data-bind="
         text: App.game.party.pokemonAttackObservable().toLocaleString('en-US'),
         tooltip: {
            html: true,
            title: Battle.pokemonAttackTooltip($data.battle ?? Battle),
            trigger: 'hover',
         }
         "></span>
    </span>
</script>
