<div class="modal noselect fade" id="QuestModal" tabindex="-1" role="dialog" aria-labelledby="QuestModalLabel">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header p-0">
                <ul class="nav nav-tabs nav-fill w-100">
                    <li class="nav-item" onclick="$('#refreshQuests').show()"><a class="nav-link active" href="#questsModalQuestsPane" data-toggle="tab" data-bind="t: 'quests.tabQuests'">Quests</a></li>
                    <li class="nav-item" onclick="$('#refreshQuests').hide()">
                        <a class="nav-link position-relative" href="#questsModalQuestLinesPane" data-toggle="tab">
                            <knockout data-bind="t: 'quests.questLines'">Quest Lines</knockout>
                            <span class="position-absolute rounded-circle bg-danger p-1"
                                data-bind="visible: App.game.quests.questLines().some(q => q.state() === QuestLineState.inactive && q.bulletinBoard !== GameConstants.BulletinBoards.None && q.requirement?.isCompleted())"></span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="modal-body p-0">
                <div class="tab-content">

                    <!-- Quests -->
                    <div class="tab-pane active" id="questsModalQuestsPane">
                        <div class="container">
                            <div class="form-row mt-3 mb-2">
                                <div class="col-3 align-self-center">
                                    <h5>
                                        <span class='' data-bind="text: App.translation.ui('quests.titleCount', 'Quests ({{current}}/{{slots}})', { current: App.game.quests.currentQuests().length, slots: App.game.quests.questSlots() })"></span>
                                    </h5>
                                </div>
                                <div class='col-6' data-bind="tooltip : App.game.quests.questProgressTooltip()">
                                    <div data-bind="t: 'quests.level', tVars: { level: App.game.quests.level }">Lvl. {{level}}</div>
                                    <div class="progress" style='height: 5px'>
                                        <div class="progress-bar bg-info" role="progressbar"
                                                data-bind="attr:{ style: 'width:' + App.game.quests.percentToNextQuestLevel() + '%' }"
                                                aria-valuemin="0" aria-valuemax="100">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-3 align-self-center">
                                    <span data-bind="template: { name: 'currencyTemplate', data: {'amount': App.game.wallet.currencies[GameConstants.Currency.questPoint](), 'currency': GameConstants.Currency.questPoint}}"></span>
                                </div>
                            </div>
                            <div class="text-center mb-2" data-bind="visible: App.game.quests.questSlots() < GameConstants.MAX_QUEST_SLOTS">
                                <div class="small" data-bind="t: 'quests.unlockSlots'">Unlock additional quest slots at levels 5, 10, and 15!</div>
                            </div>
                        </div>

                        <table class="table table-hover m-0">
                            <thead>
                                <tr>
                                    <th class="align-middle text-left" data-bind="t: 'common.description'">Description</th>
                                    <th class="align-middle" data-bind="t: 'quests.reward'">Reward</th>
                                    <th class="align-middle" data-bind="t: 'quests.progress'">Progress</th>
                                    <th class="align-middle"></th>
                                </tr>
                            </thead>
                            <tbody data-bind="foreach: App.game.quests.sortedQuestList" >
                                <tr>
                                    <td class="align-middle text-left" data-bind="text: description"></td>
                                    <td class="align-middle text-center py-0">
                                        <span data-bind="template: { name: 'currencyTemplate', data: {'amount':  pointsReward, 'currency': GameConstants.Currency.questPoint}}"></span>
                                    </td>
                                    <td class="align-middle text-center py-0">
                                        <span data-bind="visible: $data.inProgress() && !$data.isCompleted(), text: `${Math.floor(progress()*100)}%`"></span>
                                        <span data-bind="visible: !$data.inProgress() && !$data.isCompleted()">-</span>
                                        <span class="text-muted" data-bind="visible: $data.isCompleted(), t: 'quests.completed'">Completed</span>
                                    </td>
                                    <td class="align-middle text-center py-0">
                                        <button class="btn btn-primary btn-sm btn-block mt-0"
                                            data-bind="visible: App.game.quests.canStartNewQuest() && !$data.inProgress() && !$data.isCompleted() && !$data.claimed(),
                                                click: () => App.game.quests.beginQuest($data.index),
                                                t: 'quests.start'">Start</button>
                                        <button class="btn btn-success btn-sm btn-block mt-0"
                                            data-bind="visible: !$data.claimed() && $data.isCompleted(),
                                                click: () => App.game.quests.claimQuest($data.index),
                                                t: 'quests.claim'">Claim</button>
                                        <button class="btn btn-danger btn-sm btn-block mt-0"
                                            data-bind="visible: $data.inProgress() && !$data.isCompleted(),
                                                click: () => App.game.quests.quitQuest($data.index, $data.progress() > 0),
                                                t: 'quests.quit'">Quit</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Quest Lines -->
                    <div class="tab-pane" id="questsModalQuestLinesPane">
                        <div class="px-2 pt-3 text-left" data-bind="with: {
                            active: App.game.quests.questLines().filter(q => q.state() === QuestLineState.started),
                            available: App.game.quests.questLines().filter(q => (q.state() === QuestLineState.inactive || q.state() === QuestLineState.suspended) && q.bulletinBoard !== GameConstants.BulletinBoards.None && q.requirement?.isCompleted()),
                            complete: App.game.quests.questLines().filter(q => q.state() === QuestLineState.ended)
                        }">
                            <!-- ko if: $data.active.length -->
                            <div class="bg-primary p-2">
                                <h6 class="m-0 text-light font-weight-bold" data-bind="t: 'quests.activeQuestLines'">Active Quest Lines</h6>
                            </div>
                            <table class="table table-striped table-bordered table-hover table-sm">
                                <thead>
                                    <tr>
                                        <th data-bind="t: 'common.name'">Name</th>
                                        <th class="text-center" data-bind="t: 'quests.step'">Step</th>
                                        <th style="width: 1px;"></th>
                                    </tr>
                                </thead>
                                <tbody data-bind="foreach: $data.active">
                                    <tr>
                                        <td class="clickable" data-bind="click: () => { QuestLineController.showQuestLineDetailsModal($data) }">
                                            <knockout class="font-weight-bold d-block" data-bind="text: $data.displayName"></knockout>
                                            <knockout class="small" data-bind="text: $data.description"></knockout>
                                        </td>
                                        <td class="clickable text-nowrap align-middle text-center" data-bind="
                                            text: `${$data.curQuest() + 1} / ${$data.totalQuests}`,
                                            click: () => { QuestLineController.showQuestLineDetailsModal($data) }"></td>
                                        <td class="align-middle text-center">
                                            <button type="button" class="btn btn-danger btn-sm" data-bind="click: () => { $data.suspendQuest() }, tooltip: {
                                                title: $data.pauseTooltip,
                                                trigger: 'hover',
                                                placement: 'top',
                                                html: true,
                                                boundary: 'window'
                                            }, css: { disabled: !$data.isPausable() }, t: 'quests.pause'">Pause</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- /ko -->

                            <!-- ko if: $data.available.length -->
                            <div class="bg-primary p-2">
                                <h6 class="m-0 text-light font-weight-bold" data-bind="t: 'quests.availableQuestLines'">Available Quest Lines</h6>
                            </div>
                            <table class="table table-striped table-bordered table-hover table-sm">
                                <thead>
                                    <tr>
                                        <th class="align-middle" data-bind="t: 'common.name'">Name</th>
                                        <th class="text-nowrap text-center" data-bind="t: 'bulletinBoard.title'">Bulletin Board</th>
                                    </tr>
                                </thead>
                                <tbody data-bind="foreach: $data.available">
                                    <tr class="clickable" data-bind="click: () => { QuestLineController.showQuestLineDetailsModal($data) }">
                                        <td>
                                            <knockout class="font-weight-bold d-block" data-bind="text: $data.displayName"></knockout>
                                            <knockout class="small" data-bind="text: $data.description"></knockout>
                                        </td>
                                        <td class="text-nowrap text-center align-middle" data-bind="text: BulletinBoard.getLocation($data.bulletinBoard)"></td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- /ko -->

                            <!-- ko if: $data.complete.length -->
                            <div class="bg-primary p-2">
                                <h6 class="m-0 text-light font-weight-bold" data-bind="t: 'quests.completeQuestLines'">Complete Quest Lines</h6>
                            </div>
                            <table class="table table-striped table-bordered table-hover table-sm">
                                <tbody data-bind="foreach: $data.complete">
                                    <tr class="clickable" data-bind="click: () => { QuestLineController.showQuestLineDetailsModal($data) }">
                                        <td>
                                            <knockout class="font-weight-bold d-block" data-bind="text: $data.displayName"></knockout>
                                            <knockout class="small" data-bind="text: $data.description"></knockout>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <!-- /ko -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer justify-content-start flex-nowrap">
                <div id="refreshQuests">
                    <div class="d-flex flex-wrap align-items-center" style="gap: 8px;">
                        <!-- ko if: App.game.quests.isRefreshFree() -->
                        <button class="btn btn-primary" onclick="App.game.quests.refreshQuests(true, true)" data-bind="t: 'quests.freeRefresh'">Free Refresh</button>
                        <!-- /ko -->
                        <!-- ko if: !App.game.quests.isRefreshFree() -->
                        <button class="btn btn-primary" onclick="App.game.quests.refreshQuests(false, true)"
                            data-bind="enable: App.game.quests.canAffordRefresh(),
                                tooltip: {
                                    title: App.game.quests.freeRefresh() ? '' : App.translation.ui('quests.dailyFreeRefreshIn', 'Daily free refresh in: {{time}}', { time: GameHelper.formattedLetterTimeUntilTomorrow() }),
                                    trigger: 'hover', placement:'top'
                                }">
                            <span data-bind="template: { name: 'amountTemplate', data: App.game.quests.getRefreshCost() }"></span> <knockout data-bind="t: 'quests.refresh'">- Refresh</knockout>
                        </button>
                        <!-- /ko -->
                        <span>
                            <knockout data-bind="t: 'quests.completeAllBonus'">Or complete all quests for a bonus</knockout><knockout data-bind="template: { name: 'currencyTemplate', data: {'amount': App.game.quests.calcListBonus(), 'currency': GameConstants.Currency.questPoint}}"></knockout>
                        </span>
                    </div>
                </div>
                <div class="flex-grow-1 text-right">
                    <button type="button" class="btn btn-danger" data-dismiss="modal" data-bind="t: 'common.close'">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
