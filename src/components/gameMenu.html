<div id="startMenu" class="dropdown clearfix" style="position:absolute; right:0; top:0; z-index: 100;">
    <button class="btn btn-secondary mr-1 float-left" style="display: none;"
        data-bind="visible: Settings.getSetting('disableAutoSave').observableValue,
            click: () => { Save.store(player, true); },
            tooltip: {
                html: true,
                title: App.translation.ui('menu.saveTooltip', 'Save the game.<br/>Shortcut: {{shortcut}}', { shortcut: `${Settings.getSetting('hotkey.forceSave').prefix}${Settings.getSetting('hotkey.forceSave').observableValue()}` }),
                trigger: 'hover',
                placement: 'bottom'
            }">
        <img src="assets/images/floppy-disk.svg" height="20px" width="20px" style="margin-top: -3px;">
    </button>
    <button class="btn btn-secondary mr-1 float-left"
        data-bind="visible: Settings.getSetting('showMuteButton').observableValue(),
            click: () => { Settings.getSetting('sound.muted').toggle() },
            tooltip: { title: Settings.getSetting('sound.muted').observableValue() ? App.translation.ui('menu.unmuteTooltip', 'Click to unmute all sounds.') : App.translation.ui('menu.muteTooltip', 'Click to mute all sounds.'), trigger: 'hover', placement: 'bottom' }">
        <img src="assets/images/volume-high.svg" height="20px" width="20px" style="margin-top: -3px;"
            data-bind="attr: { src: `assets/images/${Settings.getSetting('sound.muted').observableValue() ? 'volume-xmark' : 'volume-high'}.svg` }">
    </button>
    <button class="btn btn-secondary dropdown-toggle float-right" type="button" data-toggle="dropdown">
        <knockout data-bind="t: 'menu.startMenu'">Start Menu</knockout>
        <span class="caret"></span>
    </button>
    <ul class="dropdown-menu dropdown-menu-right">
        <li>
            <a class="dropdown-item" href="#pokedexModal" data-toggle="modal" data-bind="t: 'menu.pokedex'">Pokédex</a>
        </li>
        <li>
            <a class="dropdown-item" href="#showItemsModal" data-toggle="modal" data-bind="t: 'menu.items'">Items</a>
        </li>
        <li data-bind="attr: {  title: App.game.gems.canAccess() ? '' : App.translation.ui('menu.progressToUnlock', 'Progress further to unlock...')}">
            <a class="dropdown-item" href="#" data-bind="click:function(){App.game.gems.openGemModal()},
            attr: {class: App.game.gems.canAccess() ? 'dropdown-item' : 'dropdown-item disabled all-pointers'},
            t: 'menu.gems'">Gems</a>
        </li>
        <li>
            <a class="dropdown-item" href="#profileModal" data-toggle="modal" data-bind="t: 'menu.profile'">Profile</a>
        </li>
        <li>
            <a class="dropdown-item" href="#badgeCaseModal" data-toggle="modal" data-bind="t: 'menu.badgeCase'">Badge Case</a>
        </li>
        <li>
            <a class="dropdown-item" href="#saveModal" data-toggle="modal" data-bind="t: 'menu.save'">Save / Enter Code</a>
        </li>
        <li>
            <a class="dropdown-item" href="#settingsModal" data-toggle="modal" data-bind="t: 'menu.settings'">Settings</a>
        </li>
        <li>
            <a class="dropdown-item" href="#eventsModal" data-toggle="modal" data-bind="t: 'menu.events'">Events</a>
        </li>
        <li>
            <button class="dropdown-item" href="#statisticsModal" data-toggle="modal" data-bind="t: 'menu.statistics'">Statistics</button>
        </li>
        <li>
            <a class="dropdown-item" href="#achievementsModal" data-toggle="modal" onclick="AchievementHandler.filterAchievementList(true);" data-bind="t: 'menu.achievements'">Achievements</a>
        </li>
        <li>
            <a class="dropdown-item" href="#logBookModal" data-toggle="modal" data-bind="t: 'menu.logBook'">Log Book</a>
        </li>
        <li>
            <a class="dropdown-item" href="#damageCalculatorModal" data-toggle="modal" data-bind="t: 'menu.damageCalculator'">Damage Calculator</a>
        </li>
        <li>
            <a class="dropdown-item" href="#challengeModeModal" data-toggle="modal" data-bind="t: 'menu.challengeModes'">Challenge Modes</a>
        </li>
        <li>
            <a class="dropdown-item" href="#changelogModal" data-toggle="modal" data-bind="t: 'menu.changelog'">Changelog</a>
        </li>
        <li>
            <a class="dropdown-item" href="#FAQModal" data-toggle="modal" data-bind="t: 'menu.faq'">FAQ</a>
        </li>
        <li>
            <a class="dropdown-item" href="#creditsModal" data-toggle="modal" data-bind="t: 'menu.credits'">Credits</a>
        </li>
        <li>
            <a class="dropdown-item" href="#externalLinksModal" data-toggle="modal" data-bind="t: 'menu.externalLinks'">External Links</a>
        </li>
        <li>
            <a class="dropdown-item" href="https://github.com/pokeclicker/pokeclicker/issues" target="_blank" data-bind="t: 'menu.reportBug'">Report a bug</a>
        </li>

    </ul>
</div>
