<div id="currencyContainer" class="card sortable border-secondary mb-3" data-bind="visible: player.regionStarters[GameConstants.Region.kanto]() != GameConstants.Starter.None">
    <div class="card-header p-0" data-toggle="collapse" href="#currencyBody">
        <span data-bind="t: 'currency.title'">Currency</span>
    </div>
    <div id="currencyBody" class="card-body p-0 show">
        <div class="currency-wrapper d-flex flex-wrap justify-content-around p-1" data-bind="css: { 'short-currencies': Settings.getSetting('currencyMainDisplayReduced').observableValue() }">
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.money, tooltip: App.translation.ui('currency.moneyTooltip', 'Pokédollars<br /><br />Gained by defeating Pokémon and trainers in battle.') } }"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.dungeonToken, tooltip: App.translation.ui('currency.dungeonTokenTooltip', 'Dungeon Tokens<br /><br />Gained by catching wild Pokémon.') } }"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.questPoint, tooltip: App.translation.ui('currency.questPointTooltip', 'Quest Points<br /><br />Gained by completing Quests.') } }"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.farmPoint, tooltip: App.translation.ui('currency.farmPointTooltip', 'Farm Points<br /><br />Gained by harvesting berries on the Farm.') } },
                visible: App.game.farming.canAccess() || App.game.wallet.currencies[GameConstants.Currency.farmPoint]() > 0"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.diamond, tooltip: App.translation.ui('currency.diamondTooltip', 'Diamonds<br /><br />Gained by selling treasure found in the Underground.') } },
                visible: App.game.underground.canAccess() || App.game.wallet.currencies[GameConstants.Currency.diamond]() > 0"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.battlePoint, tooltip: App.translation.ui('currency.battlePointTooltip', 'Battle Points<br /><br />Gained at the Battle Frontier.') } },
                visible: TownList['Battle Frontier'].isUnlocked() || App.game.wallet.currencies[GameConstants.Currency.battlePoint]() > 0"></div>
            <div data-bind="template: { name: 'currency-display-template', data: { currency: GameConstants.Currency.contestToken, tooltip: App.translation.ui('currency.contestTokenTooltip', 'Contest Tokens<br /><br />Gained by competing in Contests.') } },
                visible: TownList['National Park'].isUnlocked() || App.game.wallet.currencies[GameConstants.Currency.contestToken]() > 0"></div>
        </div>
    </div>
</div>
